<form action="submit.html" method="get">
          <fieldset>
                    <legend>Personal Information</legend>
                    <label for="uname">Full name:</label>
                    <input type="text" id="uname" name="un" placeholder="Enter your name"
                     autofocus autocomplete required>
                    <br>
                    <br>
                    <label>Email:</label>
                    <input type="email" name="eid" placeholder="Enter your email" required>
                    <br>
                    <br>
                    <label>Mobile:</label>
                    <input type="tel" maxlength="10" minlength="10" name="cn" placeholder="Enter mobile number">
                    <br>
                    <br>
                    <label>Gender:</label>
                    <input type="radio" name="Gender" value="male" checked/>Male
                    <input type="radio" name="Gender" value="female"/>Female
          </fieldset>
          <fieldset>
                    <legend>Academic Information</legend>
                    <label>Course:</label>
                    <select name="Course">
                              <option value="select">Select Course</option>
                              <option value="M.Tech">M.Tech</option>
                              <option value="B.Tech">B.Tech</option>
                              <option value="phD">phD</option>
                    </select>
                    <br>
                    <br>
                    <label>Age:</label>
                    <input type="number" min="18" max="40" value="20" step="1" name="age">
                    <br>
                    <br>
                    <label>Skills:</label>
                    <input type="checkbox" name="Subject" value="HTML"/>HTML
                    <input type="checkbox" name="Subject" value="CSS"/>CSS
                    <input type="checkbox" name="Subject" value="JavaScript"/>JavaScript
          </fieldset>
          <fieldset>
                    <legend>Other Information</legend>
                    <label>Joining Date:</label>
                    <input type="date" name="dob" min="2026-01-01" max="2026-12-31">
                    <br>
                    <br>
                    <label>Message:</label>
                    <textarea cols="30" rows="4" name="comments"
                     placeholder="what is HTML">My first comment</textarea>
          </fieldset>
          <br>
                    <input type="submit" value="Register">
                    <input type="reset" value="clear">
