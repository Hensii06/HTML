<form action="submit.html" method="get">
          <fieldset>
                    <legend>Personal Information</legend>
                    <label for="uname">Username:</label>
                    <input type="text" id="uname" name="un" placeholder="Enter your name"
                     autofocus autocomplete required>
                    <br>
                    <label>Email Id:</label>
                    <input type="email" name="eid" placeholder="abc@gmail.com" required>
                    <br>
                    <label>password:</label>
                    <input type="password" placeholder="Enter password" maxlength="10" minlength="7" required>
                    <br>
                    <label>Contact number:</label>
                    <input type="tel" maxlength="12" minlength="12" name="cn" placeholder="987654321054">
                    <br>
                    <label>Age:</label>
                    <input type="number" min="10" max="25" value="18" step="1" name="age">
          </fieldset>
          <fieldset>
                    <label>DOB:</label>
                    <legend>Additional Information</legend>
                    <input type="date" name="dob" min="2001-01-01" max="2026-09-01">
                    <br>
                    <label>Fav color:</label>
                    <input type="color" name="fav color" value="#000000">
                    <br>
                    <label>Rating:</label>
                    <input type="range" min="0" max="20" step="2" value="10" name="Rating" oninput="my.innerHTML=this.value">
                    <span id="my">10</span>
                    <br>
                    <label>Gender:</label>
                    <input type="radio" name="Gender" value="male" checked/>Male
                    <input type="radio" name="Gender" value="female" checked/>Female
                    <hr width="80%" size="5" color="purple" align="center">
                    <br>
                    <label>CheckBox:</label>
                    <input type="checkbox" name="Subject" value="FSD1" checked/>FSD1
                    <input type="checkbox" name="Subject" value="Python1"/>Python1
                    <br>
                    <label>Comments:</label>
                    <textarea cols="30" rows="20" name="comments"
                     placeholder="Enter your comments">My first comment</textarea>
          </fieldset>
          <fieldset>
                    <legend>Buttons</legend>
                    <input type="submit" value="Submit Data">
                    <input type="reset" value="Reset values">
                    <input type="button" value="Button">
                    <button type="submit">Submit button</button>
                    <button>Form submit</button>
          </fieldset>
</form>
