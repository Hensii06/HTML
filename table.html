<html>
<head>
    <title> table </title>
</head>
<table border="5" align="center" bgcolor="sky blue" cellpadding="25" cellspacing="10" width="50%" rules="rows">
    <caption>My Table</caption>
    <thead>
        <tr bgcolor="red">
            <th>Name</th>
            <th>Age</th>
            <th>Branch</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>A</td>
            <td>18</td>
            <td>CSE</td>
        </tr>
        <tr>
            <td>B</td>
            <td>19</td>
            <td>CE</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td bgcolor="orange">Total</td>
            <td>2</td>
            <td>2</td>
        </tr>
    </tfoot>
</table>


<br><br><br><br><br>
<hr>
<table border="1" align="center" cellpading="10" rules="all">
    <caption>Rowspan</caption>
    <tr> 
        <td rowspan="2">A</td>
        <td>B</td>
        <hr>
        <tr>
            <td>C</td>
        </tr>
    </tr>
</table>


<br><br><br><br><br>
<hr>
<table border="1" align="center" cellpading="10" rules="all">
    <caption>Colspan</caption>
    <tr> 
        <td colspan="2" align="center">A</td>
        <tr>
            <td>B</td>
            <td>C</td>
        </tr>
    </tr>
</table>
